name: Website feature request
description: Propose a new public website capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem rather than only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the page, workflow, filter, integration, or presentation change.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - New user evaluating eeFunction
        - Free user
        - Pro user
        - Engineering reviewer
        - Community contributor
        - Procurement or IT administrator
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add examples, references, or screenshots without private or licensed material.
